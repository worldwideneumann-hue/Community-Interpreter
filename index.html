<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treinamento OPI/VRI para Bilíngues</title>
  <style>
    :root {
      --bg-light: #f5f7fa;
      --bg-dark: #1b263b;
      --card-bg-dark: #243048;
      --yellow: #ffb703;
      --yellow-hover: #e0a100;
      --navy-dark: #0f172a;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --text-light: #ffffff;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.5;
    }

    a {
      text-decoration: none;
    }

    /* --- HEADER --- */
    header {
      background: #ffffff;
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: var(--yellow);
      padding: 8px;
      border-radius: 50%;
      font-size: 1.2rem;
    }

    .brand-text h1 {
      font-size: 0.95rem;
      color: var(--navy-dark);
      font-weight: 700;
    }

    .brand-text p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .btn-header {
      background: var(--navy-dark);
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .btn-header:hover {
      background: #334155;
    }

    /* --- HERO SECTION --- */
    .hero {
      padding: 3rem 5%;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 2rem;
      align-items: start;
      max-width: 1200px;
      margin: 0 auto;
    }

</body>
</html>
